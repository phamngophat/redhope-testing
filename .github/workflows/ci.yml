name: RedHope Unit Testing CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-test:
    name: Run Jest Core Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Core Unit Tests with Coverage
        run: npx jest tests/unit/services/donation-cooldown.test.ts tests/unit/services/donation.service.test.ts tests/unit/services/user.service.test.ts --coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock-supabase.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "mock-service-role-key"
          GEMINI_API_KEY: "mock-gemini-key"
name: RedHope Unit Testing CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install TypeScript runner for Jest
        run: npm install -D ts-node

      - name: Run Jest Unit Tests
        run: npx jest tests/unit/services/donation-cooldown.test.ts tests/unit/services/donation.service.test.ts tests/unit/services/user.service.test.ts